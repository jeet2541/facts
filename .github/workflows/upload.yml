
name: JeetStoryAI YouTube Automation

on:
  workflow_dispatch:

  schedule:
    # 09:00 AM IST
    - cron: "30 3 * * *"

    # 12:00 PM IST
    - cron: "30 6 * * *"

    # 03:00 PM IST
    - cron: "30 9 * * *"

    # 06:00 PM IST
    - cron: "30 12 * * *"

    # 09:00 PM IST
    - cron: "30 15 * * *"

permissions:
  contents: write

concurrency:
  group: jeetstoryai-uploader
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Verify FFmpeg
        run: |
          ffmpeg -version
          ffprobe -version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check required secrets
        env:
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          if [ -z "$DRIVE_FOLDER_ID" ]; then
            echo "ERROR: DRIVE_FOLDER_ID secret is missing"
            exit 1
          fi

          if [ -z "$YOUTUBE_TOKEN_JSON" ]; then
            echo "ERROR: YOUTUBE_TOKEN_JSON secret is missing"
            exit 1
          fi

      - name: Restore OAuth token
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          printf '%s' "$YOUTUBE_TOKEN_JSON" > token.json

      - name: Upload next YouTube Short
        env:
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          MAX_UPLOADS_PER_RUN: "1"
          DAILY_UPLOAD_LIMIT: "5"
        run: python -u uploader.py

      - name: Save upload history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -f upload_history.json ]; then
            git add upload_history.json
          fi

          if git diff --cached --quiet; then
            echo "No upload history changes"
          else
            git commit -m "Update JeetStoryAI upload history"
            git push
          fi
