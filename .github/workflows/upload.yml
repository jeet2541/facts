
name: WhatHappensFactora YouTube Automation

on:
  workflow_dispatch:
  schedule:
    # 12:30 PM IST
    - cron: "0 7 * * *"
    # 7:00 PM IST
    - cron: "30 13 * * *"

permissions:
  contents: write

concurrency:
  group: whathappensfactora-uploader
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore OAuth token
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          printf '%s' "$YOUTUBE_TOKEN_JSON" > token.json

      - name: Upload next video
        env:
          DRIVE_FOLDER_ID: ${{ vars.DRIVE_FOLDER_ID }}
          MAX_UPLOADS_PER_RUN: "1"
          YOUTUBE_PRIVACY_STATUS: ${{ vars.YOUTUBE_PRIVACY_STATUS }}
        run: python uploader.py

      - name: Save upload history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add upload_history.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update upload history"
            git push
          fi
